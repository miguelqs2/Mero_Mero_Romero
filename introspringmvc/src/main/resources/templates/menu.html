<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mero Mero Romero - Menú</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #e0f7fa; padding: 20px; margin: 0; background-image: linear-gradient(to bottom, #e0f7fa, #ffffff); display: flex; justify-content: center; height: 100vh; box-sizing: border-box;}
        .container { width: 100%; max-width: 1200px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden;}
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #0277bd; color: white; padding: 15px 25px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex-shrink: 0;}
        .logo-y-mesera { display: flex; align-items: center; gap: 20px; }
        .logo-y-mesera img { height: 100px; width: auto; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.3); object-fit: contain; }
        .mesera-select { display: flex; align-items: center; gap: 10px; font-weight: bold;}
        .mesera-select select { padding: 8px 10px; border-radius: 5px; border: none; font-weight: bold; background: #fff; color: #0277bd; cursor: pointer; outline: none;}
        .buscador { flex-grow: 1; margin: 0 50px 0 30px; max-width: 600px; }
        .buscador input { width: 100%; padding: 12px 20px; border-radius: 25px; border: none; outline: none; font-size: 1em; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);}
        .btn-carrito { background: #d32f2f; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; transition: 0.3s; box-shadow: 0 3px 0 #9a0007; display: flex; align-items: center; justify-content: center; white-space: nowrap;}
        .btn-carrito:hover { background: #f44336; transform: translateY(-2px);}
        .btn-morado { background: #8e24aa; box-shadow: 0 3px 0 #4a148c; }
        .btn-morado:hover { background: #ab47bc; }
        
        .tabla-wrapper { flex-grow: 1; overflow-y: auto; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; }
        
        th, td { padding: 15px 12px; border-bottom: 1px solid #eee; text-align: left; vertical-align: middle; }
        th { background-color: #01579b; color: white; font-size: 1.1em; text-transform: uppercase; letter-spacing: 1px; position: sticky; top: 0; z-index: 10;}
        
        
        .categoria-header td {
            background-color: #e1f5fe;
            color: #0277bd;
            font-weight: 900;
            font-size: 1.1em;
            text-transform: uppercase;
            padding: 10px 15px;
            border-top: 3px solid #0277bd;
        }

        .btn-agregar { background: #43a047; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-weight: bold; box-shadow: 0 2px 0 #2e7d32; transition: 0.2s; width: 100%;}
        .btn-agregar:hover:not(:disabled) { background: #4caf50; }
        .btn-agregar:disabled { background: #bdc3c7; cursor: not-allowed; box-shadow: none;}

        .contenedor-tamanos { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn-tamano { 
            background: white; color: #01579b; border: 2px solid #0277bd; 
            padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.2s; min-width: 90px;
        }
        .btn-tamano:hover:not(:disabled) { background: #e1f5fe; transform: scale(1.05); }
        .btn-tamano:disabled { background: #f5f5f5; border-color: #ccc; color: #999; cursor: not-allowed; }
        
        .btn-tamano .precio { font-size: 1.1em; color: #d32f2f; margin-top: 3px; }
        .btn-tamano .stock { font-size: 0.75em; color: #777; }
		
		
		@media (max-width: 900px) {
		 
		    .header-bar { flex-direction: column; gap: 15px; padding: 20px; text-align: center; }
		    .logo-y-mesera { flex-direction: column; gap: 10px; }
		    .buscador { margin: 10px 0; width: 100%; max-width: 100%; }
		    .buscador input { width: 100%; box-sizing: border-box; }
		    
		    
		    .header-bar > div:last-child { width: 100%; justify-content: center; flex-wrap: wrap; }
		    
		    
		    .tabla-wrapper { overflow-x: auto; } 
		    .tabla-admin th, .tabla-admin td { padding: 10px 8px; font-size: 0.9em; white-space: nowrap; }
		    
		  
		    .grid-pedidos { grid-template-columns: 1fr; } 
		    
		  
		    .modal-content { padding: 20px; width: 95%; max-height: 90vh; overflow-y: auto; }
		}
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <div class="logo-y-mesera">
                <img src="/logo.png" alt="Logo Mero Mero Romero">
                <div class="mesera-select">
                    <span>Mesera:</span>
                    <select id="meseraSelect" onchange="guardarMesera()">
                        <option value="Maria">Maria</option>
                        <option value="Ana">Ana</option>
                        <option value="Sofia">Sofia</option>
                        <option value="Carlos">Carlos</option>
                        <option value="Jenny">Jenny</option>
                        <option value="Nicole">Nicole</option>
                    </select>
                </div>
            </div>
            <div class="buscador">
                <input type="text" id="inputBuscar" onkeyup="filtrarTabla()" placeholder="Buscar plato por nombre...">
            </div>
            <div style="display: flex; gap: 15px;">
                <a href="/mis-pedidos" onclick="irAMisPedidos(event)" class="btn-carrito btn-morado">Mis Pedidos</a>
                <a href="/carrito" class="btn-carrito">Ver Carrito (<span th:text="${totalItems}">0</span>)</a>
            </div>
        </div>

        <div class="tabla-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Presentaciones y Precios</th>
                    </tr>
                </thead>
                <tbody id="tablaPlatos">
                    
                    <tr th:each="cat : ${categorias}">
                        <td colspan="2" style="padding: 0; border: none;">
                            <table style="width: 100%; border-collapse: collapse;">
                                
                                <tr class="categoria-header">
                                    <td colspan="2" th:text="${cat.nombre}">Categoría</td>
                                </tr>
                              
                                <tr th:each="prod : ${cat.productos}" th:id="'fila-prod-' + ${prod.idProducto}">
                                    <td style="width: 50%;">
                                        <strong th:text="${prod.nombre}" style="font-size: 1.1em; color: #01579b;">Nombre</strong>
                                    </td>
                                    <td style="width: 50%;">
                                        <div class="contenedor-tamanos">
                                            
                                            <button type="button" class="btn-tamano" 
                                                    th:each="pp : ${prod.precios}"
                                                    th:onclick="agregarAlCarrito([[${pp.idPrecio}]])"
                                                    th:id="'btn-' + ${pp.idPrecio}"
                                                    th:disabled="${pp.estado == 'AGOTADO' || pp.stock <= 0}">
                                                
                                                <span th:text="${pp.tamano}">Tamaño</span>
                                                <span class="precio" th:text="'S/ ' + ${pp.precio}">Precio</span>
                                                <span class="stock" th:id="'stock-' + ${pp.idPrecio}" th:text="'Stock: ' + ${pp.stock}">Stock</span>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    
    <form id="formAgregar" action="/agregar" method="post" style="display:none;">
        <input type="hidden" name="idPrecio" id="inputIdPrecio" />
    </form>

    <script>
    function agregarAlCarrito(idPrecio) {
        document.getElementById('inputIdPrecio').value = idPrecio;
        document.getElementById('formAgregar').submit();
    }

    function quitarTildes(texto) {
        return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
    }

    function filtrarTabla() {
        var filtro = quitarTildes(document.getElementById("inputBuscar").value.trim());
        var categorias = document.querySelectorAll(".categoria-header");

        categorias.forEach(catHeader => {
            var table = catHeader.closest('table');
            var filas = table.querySelectorAll('tr');
            var hayCoincidencias = false;

            for (var i = 1; i < filas.length; i++) {
                var nombre = filas[i].querySelector("td strong");
                if (nombre) {
                    var txtNombre = quitarTildes(nombre.textContent);
                    
                    if (txtNombre.startsWith(filtro)) {
                        filas[i].style.display = "";
                        hayCoincidencias = true;
                    } else {
                        filas[i].style.display = "none";
                    }
                }
            }

            if (hayCoincidencias || filtro === "") {
                catHeader.style.display = "";
            } else {
                catHeader.style.display = "none";
            }
        });
    }

    function guardarMesera() {
        var mesera = document.getElementById("meseraSelect").value;
        localStorage.setItem("meseraSeleccionada", mesera);
    }

    function irAMisPedidos(event) {
        event.preventDefault();
        var mesera = document.getElementById("meseraSelect").value;
        window.location.href = "/mis-pedidos?mesera=" + encodeURIComponent(mesera);
    }

    window.onload = function() {
        var meseraGuardada = localStorage.getItem("meseraSeleccionada");
        
        
        var meserasValidas = ["Maria", "Ana", "Sofia", "Carlos", "Jenny", "Nicole"];
        if (meseraGuardada && meserasValidas.includes(meseraGuardada)) {
            document.getElementById("meseraSelect").value = meseraGuardada;
        } else {
            
            document.getElementById("meseraSelect").value = "Maria";
            localStorage.setItem("meseraSeleccionada", "Maria");
        }
        
        setInterval(actualizarStockEnVivo, 3000);
    };

    function actualizarStockEnVivo() {
        fetch('/api/platos')
            .then(response => response.json())
            .then(lista => {
                lista.forEach(pp => {
                    var btnAgregar = document.getElementById('btn-' + pp.idPrecio);
                    if (btnAgregar) {
                        btnAgregar.disabled = (pp.estado === 'AGOTADO' || pp.stock <= 0);
                        var spanStock = document.getElementById('stock-' + pp.idPrecio);
                        if (spanStock) spanStock.innerText = 'Stock: ' + pp.stock;
                    }
                });
            })
            .catch(error => console.error("Error al actualizar stock:", error));
    }
    </script>
</body>
</html>
